name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust compiler and runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Rust suite
        run: cargo test --all-targets
      - name: Validate native distribution contracts
        shell: pwsh
        run: ./tests/toolchain-distribution.ps1

  vibra:
    name: Vibra-first end-to-end suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Lint Vibra tests
        run: cargo run -- lint tests --deny-warnings
      - name: Run Vibra suite
        run: cargo run -- test --report yaml

  vapp-repro:
    name: .vapp reproducibility (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: windows-2022, platform: windows-amd64 }
          - { runner: macos-15-intel, platform: macos-amd64 }
          - { runner: macos-15, platform: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Build twice and verify identical bytes
        shell: pwsh
        run: |
          $binary = if ('${{ runner.os }}' -eq 'Windows') { 'target/debug/vibra.exe' } else { 'target/debug/vibra' }
          ./tests/vapp-repro.ps1 -Vibra $binary -Output artifacts/sample.vapp
      - uses: actions/upload-artifact@v4
        with:
          name: vapp-${{ matrix.platform }}
          path: artifacts/sample.vapp

  vapp-cross-host:
    name: .vapp cross-host byte identity
    needs: vapp-repro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vapp-*
          path: artifacts
      - name: Compare every supported host output
        shell: bash
        run: |
          baseline=artifacts/vapp-linux-amd64/sample.vapp
          for artifact in artifacts/vapp-*/sample.vapp; do
            cmp "$baseline" "$artifact"
          done
