name: CI

# The roadmap requires both suites to run from a clean checkout without
# network access after dependencies are synced. The conformance job below is
# an internal corpus entrypoint, independent of the Rust host-language tests,
# and runs in parallel with them: the two jobs share no step and no result.

# Checks run on pull requests. A milestone integration branch keeps a standing
# draft pull request into main, so pushes to it are already covered and need no
# branch trigger of their own. The push trigger is kept for main alone, which
# has no pull request of its own to be checked by.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # No CI step opens a debugger and no test reads debuginfo, so skipping it
  # shortens every compile and link, Wasmtime included. Local builds keep the
  # default profile.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version; this action honours it.
      - name: Install pinned toolchain
        run: rustup toolchain install

      # The cache key is shared with the conformance job of the same operating
      # system, and both restore it, Wasmtime included. Only `main` saves it,
      # and only this job does: this job builds the whole workspace with every
      # test target, a superset of what the conformance job builds, and a pull
      # request run would save a cache that nothing restores.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      # Formatting and documentation do not depend on the platform, so one
      # operating system checks them.
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      # The workspace has no `cfg(target_os = "macos")` code. Its `cfg(unix)`
      # code is linted on Ubuntu and its `cfg(windows)` code on Windows, so
      # macOS adds no lint coverage. macOS still builds and tests below. A
      # macOS-specific item would need this condition changed.
      - name: Lints
        if: matrix.os != 'macos-latest'
        run: cargo clippy --locked --offline --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --offline --workspace --all-targets --all-features

      - name: Documentation
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --locked --offline --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The conformance corpus is a separate job from the host-language tests, and
  # since milestone 4 Step 4 it also runs every executable case in the
  # WebAssembly backend, so it runs on the three platforms the engine must build
  # on. It does not wait for `check`: the two jobs run in parallel, so the
  # pipeline takes as long as the slower of them and not the sum. On a cold
  # cache each job compiles Wasmtime for itself; on a warm one both restore the
  # build that `main` saved under the shared key. This job never saves that
  # cache, because it builds less than `check` does and its smaller build must
  # not take the key from the fuller one. The host tests of the emitter, the
  # runner, deterministic emission, and the specification
  # inventory run in `check`, whose workspace test run includes them on every
  # platform, so this job does not repeat them.
  conformance:
    name: conformance corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ matrix.os }}
          save-if: false

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      # This is the internal runner, not a user-facing `vibra` binary. It
      # executes the checked-in cases through the real handlers, the reference
      # interpreter and the WebAssembly backend, and exits nonzero on a failed or
      # unavailable case. It prints the counts by profile and by backend.
      - name: Run the corpus in both backends
        run: cargo run --locked --offline -p vibra-conformance --bin vibra-conformance -- --root conformance/cases

      - name: Run fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --locked --offline -p vibra-conformance --bin m1-fuzz -- --profile ci-smoke

  # Bounded proofs of host code: the `#[cfg(kani)]` harnesses, which every other
  # build leaves out. Kani runs on Linux only, so one operating system checks
  # them, in parallel with the jobs above. Each package that has harnesses is
  # named here: a `--workspace` run would push Wasmtime through Kani's compiler.
  # The version is pinned so that a clean checkout and CI agree.
  kani:
    name: kani proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          args: -p vibra-native -p vibra-diagnostics --output-format=terse

  archive-isolation:
    name: archive stays out of the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: rustup toolchain install

      # `archive/pre-v1` is evidence, not an input. If it ever entered the
      # workspace, its packages would appear in the resolved metadata.
      - name: No archived package resolves into the workspace
        run: |
          cargo metadata --format-version 1 --no-deps > metadata.json
          if grep -q '"archive/pre-v1' metadata.json; then
            echo "an archived package resolved into the active workspace" >&2
            exit 1
          fi
