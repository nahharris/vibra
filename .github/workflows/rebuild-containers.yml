name: Rebuild released container images

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: rebuild-containers
  cancel-in-progress: false

jobs:
  select-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - id: release
        shell: bash
        run: |
          version=$(git tag --list 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//')
          [[ -n "$version" ]] || { echo 'no stable release tag found'; exit 1; }
          # Revisions are GHCR image tags, not Git tags.  Query both packages so a
          # partially published revision is never re-used.
          package_tags() {
            gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/$1/versions?per_page=100" --jq '.[] | .metadata.container.tags[]?' || true
          }
          revisions=$( { package_tags vibra; package_tags vibra-dev; } | grep -E "^${version}-r[0-9]+$" | sort -u || true )
          max=$(printf '%s\n' "$revisions" | sed -n "s/^${version}-r\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          revision="${version}-r$(( ${max:-0} + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  rebuild-scan:
    needs: select-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: linux-amd64
            dockerfile: source/containers/Dockerfile.linux
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: linux-arm64
            dockerfile: source/containers/Dockerfile.linux
          - runner: windows-2022
            platform: windows/amd64
            suffix: windows-amd64
            dockerfile: source/containers/Dockerfile.windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          ref: v${{ needs.select-release.outputs.version }}
          path: source
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          ref: main
          path: base-config
          sparse-checkout: containers/base-images.env
      - if: runner.os == 'Windows'
        run: '& $Env:ProgramFiles\Docker\Docker\DockerCli.exe -SwitchWindowsEngine'
        shell: pwsh
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
        with:
          driver: ${{ runner.os == 'Windows' && 'docker' || 'docker-container' }}
      - name: Build and stage refreshed images
        shell: bash
        env:
          BASE_IMAGES_FILE: ${{ github.workspace }}/base-config/containers/base-images.env
        run: |
          # Release sources remain pinned to vX.Y.Z; reviewed base digests come from main.
          test -f "$BASE_IMAGES_FILE"
          source_revision=$(git -C source rev-parse HEAD)
          source_date_epoch=$(git -C source show -s --format=%ct HEAD)
          set -a
          source "$BASE_IMAGES_FILE"
          set +a
          build_args=()
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] && continue
            build_args+=(--build-arg "$key=$value")
          done < "$BASE_IMAGES_FILE"
          for kind in runtime dev; do
            if [[ "$kind" == runtime ]]; then image=ghcr.io/nahharris/vibra; else image=ghcr.io/nahharris/vibra-dev; fi
            docker buildx build "${build_args[@]}" --platform '${{ matrix.platform }}' --file '${{ matrix.dockerfile }}' --target "$kind" --push \
              --sbom=true --provenance=true \
              --build-arg VIBRA_VERSION='${{ needs.select-release.outputs.version }}' \
              --build-arg VIBRA_REVISION="$source_revision" \
              --build-arg SOURCE_DATE_EPOCH="$source_date_epoch" \
              --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
              --label org.opencontainers.image.title="$(basename "$image")" \
              --label org.opencontainers.image.description="Vibra statically typed language toolchain" \
              --label org.opencontainers.image.licenses=MIT \
              --label org.opencontainers.image.version='${{ needs.select-release.outputs.version }}' \
              --label org.opencontainers.image.revision="$source_revision" \
              --tag "$image:staging-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.suffix }}" source
          done
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: ghcr.io/nahharris/vibra:staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: ghcr.io/nahharris/vibra-dev:staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}
          severity: HIGH,CRITICAL
          exit-code: '1'
      - if: runner.os != 'Windows'
        shell: pwsh
        run: |
          $revision = git -C source rev-parse HEAD
          ./source/tests/container-smoke.ps1 -Image "ghcr.io/nahharris/vibra:staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}" -Platform linux -ExpectedVersion "${{ needs.select-release.outputs.version }}" -ExpectedRevision $revision
          ./source/tests/container-smoke.ps1 -Image "ghcr.io/nahharris/vibra-dev:staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}" -Platform linux -Dev -ExpectedVersion "${{ needs.select-release.outputs.version }}" -ExpectedRevision $revision
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $revision = git -C source rev-parse HEAD
          ./source/tests/container-smoke.ps1 -Image "ghcr.io/nahharris/vibra:staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}" -Platform windows -ExpectedVersion "${{ needs.select-release.outputs.version }}" -ExpectedRevision $revision
          ./source/tests/container-smoke.ps1 -Image "ghcr.io/nahharris/vibra-dev:staging-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}" -Platform windows -Dev -ExpectedVersion "${{ needs.select-release.outputs.version }}" -ExpectedRevision $revision
      - name: Gather immutable digests
        shell: bash
        run: |
          mkdir digests
          for image in ghcr.io/nahharris/vibra ghcr.io/nahharris/vibra-dev; do docker buildx imagetools inspect "$image:staging-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.suffix }}" --format '{{.Manifest.Digest}}' | xargs -I{} sh -c 'echo "$0@{}"' "$image" > "digests/$(basename "$image")-${{ matrix.suffix }}.txt"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rebuild-digests-${{ matrix.suffix }}
          path: digests/

  promote:
    needs: [select-release, rebuild-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: digests
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
      - name: Promote revision and only moving aliases
        shell: bash
        run: |
          version='${{ needs.select-release.outputs.version }}'; revision='${{ needs.select-release.outputs.revision }}'; mm=${version%.*}; major=${version%%.*}
          package_tags() {
            gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/$1/versions?per_page=100" --jq '.[] | .metadata.container.tags[]?' || true
          }
          # Guard immediately before promotion: revision aliases are immutable.
          if { package_tags vibra; package_tags vibra-dev; } | grep -Fx "$revision"; then
            echo "Refusing to overwrite existing immutable revision: $revision" >&2
            exit 1
          fi
          # Never overwrite immutable exact X.Y.Z; only revision and moving X.Y, X, latest aliases advance.
          for image in ghcr.io/nahharris/vibra ghcr.io/nahharris/vibra-dev; do refs=$(find digests -name "$(basename "$image")-*.txt" -exec cat {} +); docker buildx imagetools create --tag "$image:$revision" --tag "$image:$mm" --tag "$image:$major" --tag "$image:latest" $refs; done
      - id: promoted
        shell: bash
        run: |
          echo "runtime=$(docker buildx imagetools inspect ghcr.io/nahharris/vibra:${{ needs.select-release.outputs.revision }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "dev=$(docker buildx imagetools inspect ghcr.io/nahharris/vibra-dev:${{ needs.select-release.outputs.revision }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ghcr.io/nahharris/vibra
          subject-digest: ${{ steps.promoted.outputs.runtime }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ghcr.io/nahharris/vibra-dev
          subject-digest: ${{ steps.promoted.outputs.dev }}
          push-to-registry: true
      - name: Verify promoted image attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh attestation verify "oci://ghcr.io/nahharris/vibra@${{ steps.promoted.outputs.runtime }}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "oci://ghcr.io/nahharris/vibra-dev@${{ steps.promoted.outputs.dev }}" --repo "${GITHUB_REPOSITORY}"
