id = "V1-TYPE-NOMINAL-variadic-function-value"
rule = "V1-TYPE-NOMINAL"
profile = "static-v1"
operation = "type-check"
description = "A builtin static method with a variadic tail keeps the tail in its function type: array.of is accepted where a function type with a variadic array tail is written and is an argument mismatch where a fixed function type with one array parameter is."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.argument-mismatch"
level = "@error"
source = "input.vib"
span = [287, 295]
