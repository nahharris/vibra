id = "V1-EFFECT-host-target-array-omits-env-read"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "workspace-check"
description = "The target array is the user's consent: an entry that performs @std.env.read.var, with its ceiling written, is rejected at the entry value when the array omits @std.env.read. The witness is the one call that introduces the root."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@effect.outside-ceiling"
level = "@error"
source = "project.vibon"
span = [145, 159]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [96, 117]
  message = "performs @std.env.read via @std.env.read.var"
