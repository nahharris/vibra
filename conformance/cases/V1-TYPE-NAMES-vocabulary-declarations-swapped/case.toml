id = "V1-TYPE-NAMES-vocabulary-declarations-swapped"
rule = "V1-TYPE-NAMES"
profile = "static-v1"
operation = "workspace-check"
description = "The reservation of a closed-vocabulary value does not depend on the kind of declaration: a user module value spelled false and a function spelled true are @name.reserved-value-spelling, the other way round from V1-TYPE-NAMES-vocabulary-declarations."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.reserved-value-spelling"
level = "@error"
source = "src/app/main.vib"
span = [0, 29]

[[expect.diagnostics]]
code = "@name.reserved-value-spelling"
level = "@error"
source = "src/app/main.vib"
span = [30, 61]
