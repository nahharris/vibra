id = "V1-TYPE-NAMES-resolve-import-cycle"
rule = "V1-TYPE-NAMES-resolution"
profile = "static-v1"
operation = "resolve"
description = "Import back edges receive the dedicated cycle diagnostic."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@module.import-cycle"
level = "@error"
source = "src/b.vib"
span = [0, 17]

  [[expect.diagnostics.related]]
  source = "src/a.vib"
  span = [0, 17]
