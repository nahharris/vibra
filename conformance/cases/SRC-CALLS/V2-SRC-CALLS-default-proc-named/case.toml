id = "V2-SRC-CALLS-default-proc-named"
rule = "V2-SRC-CALLS-default-proc-named"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#constant-expressions-and-constant-patterns: the name of a declared proc as a value is not a constant expression, so it is no labelled default and is @type.notConstant"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.notConstant"
