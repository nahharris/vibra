id = "V2-TYPE-INFER-out-of-range-large"
rule = "V2-TYPE-INFER-out-of-range"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#scalars: a U8 literal above 255 does not fit its type"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.numericOutOfRange"
level = "@error"
source = "src/app/main.vib"
span = { start = 32, end = 37 }
