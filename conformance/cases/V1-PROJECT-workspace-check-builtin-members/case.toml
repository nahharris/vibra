id = "V1-PROJECT-workspace-check-builtin-members"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "Builtin static methods resolve through the type path with no import, and a path naming no member of a builtin type is an unknown symbol."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.unknown-symbol"
level = "@error"
source = "src/app/main.vib"
span = [240, 253]
