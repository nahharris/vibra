id = "V2-SRC-DECL-type-intrinsic-outside-stdlib"
rule = "V2-SRC-DECL-type-intrinsic-outside-stdlib"
profile = "readerV2"
operation = "reader"
description = "01-source-language.md#type: an Intrinsic body outside the embedded standard library is an invalid section at the body"

[inputs]
