id = "V2-SRC-DECL-use-late"
rule = "V2-SRC-DECL-use-late"
profile = "readerV2"
operation = "reader"
description = "01-source-language.md#grammar: a use after another top-level form is an invalid form at the use, and the formatter moves nothing"

[inputs]
source = "input.vib"

[expect]
verdict = "refuted"
formatted = "formatted.vib"

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
span = { start = 0, end = 20 }

[[expect.diagnostics]]
code = "@syntax.invalidForm"
level = "@error"
span = { start = 22, end = 25 }
