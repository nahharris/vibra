id = "V1-EFFECT-host-signature-mismatch"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "workspace-check"
description = "A @host member whose declared signature differs from its registry row in any type is @type.type-argument-mismatch at the declaration, with the registry signature as a note. The owner is checked independently, so the same member is also rejected for its owner."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.type-argument-mismatch"
level = "@error"
source = "src/app/main.vib"
span = [40, 138]
notes = ["the registry signature is (value str) -> (result void io-error)"]

[[expect.diagnostics]]
code = "@external.owner-mismatch"
level = "@error"
source = "src/app/main.vib"
span = [121, 137]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [30, 37]
  message = "the enclosing deffect"
