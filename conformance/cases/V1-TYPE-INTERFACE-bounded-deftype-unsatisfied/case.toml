id = "V1-TYPE-INTERFACE-bounded-deftype-unsatisfied"
rule = "V1-TYPE-INTERFACE"
profile = "static-v1"
operation = "workspace-check"
description = "A bounded deftype is applied only at arguments satisfying its bound: in a signature, a constructor, a body annotation, and a module value; a bounded lambda likewise at each application."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "src/app/main.vib"
span = [76, 94]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "src/app/main.vib"
span = [148, 169]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "src/app/main.vib"
span = [221, 239]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "src/app/main.vib"
span = [261, 308]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "src/app/main.vib"
span = [410, 423]
