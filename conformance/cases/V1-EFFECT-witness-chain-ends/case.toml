id = "V1-EFFECT-witness-chain-ends"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "workspace-check"
description = "A witness can end at a function value or at a contract member deep in the chain: the call of a function whose body applies a function value, or a contract member, names that application with its own explanation."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@effect.outside-ceiling"
level = "@error"
source = "src/app/main.vib"
span = [375, 396]
notes = ["performs @app.main.write via @app.main.through-value"]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [216, 225]
  message = "performs @app.main.write via a function value of type (fn (str) void effects: (app.main.write))"

[[expect.diagnostics]]
code = "@effect.outside-ceiling"
level = "@error"
source = "src/app/main.vib"
span = [441, 464]
notes = ["performs @app.main.write via @app.main.through-member"]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [291, 310]
  message = "performs @app.main.write via contract member @app.main.logger.log"
