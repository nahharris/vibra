id = "V2-RUNTIME-trace-trap-no-event"
rule = "V2-RUNTIME-trace-trap-no-event"
profile = "interpreterV2"
operation = "workspaceTest"
description = "07-diagnostics-and-conformance.md#required-coverage: an exhaustion after a host write invents no event"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "unknown"
testRun = "test-run.vibon"
hostEvent = "@runtime.memoryExhausted"

[[expect.diagnostics]]
code = "@runtime.memoryExhausted"
level = "@error"
span = { start = 0, end = 0 }
