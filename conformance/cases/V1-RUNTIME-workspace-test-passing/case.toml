id = "V1-RUNTIME-workspace-test-passing"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-test"
description = "An explicitly imported trusted assertion passes and has an empty isolated trace."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
interpreter = { result = "result.vibon" }
