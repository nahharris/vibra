id = "V1-SRC-READER-invalid-character-literals"
rule = "V1-SRC-READER"
profile = "reader-v1"
description = "Malformed EDN character spellings report complete token spans and recover to valid siblings."

[inputs]
source = "input.vib"

[expect]
accepted = false
formatted = "formatted.vib"

