id = "V1-RUNTIME-external-untrusted"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "interpret"
description = "Copied compiler declarations remain unavailable outside the verified bootstrap."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
source = "input.vib"
span = [0, 71]
