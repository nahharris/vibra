id = "V1-PROJECT-workspace-check-nominal-availability"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "A @host effect member naming no registry row is rejected at its symbol string, while a wrapper over an array, a declared union, a parameter naming the wrapper, and an interface with an implementation for i32 are available."

[inputs]
project = "tree/project.vibon"
