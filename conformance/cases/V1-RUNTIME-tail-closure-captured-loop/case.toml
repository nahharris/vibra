id = "V1-RUNTIME-tail-closure-captured-loop"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "interpret"
description = "A closure that tail-calls its creator's loop through a captured function value, and the loop that tail-calls the closure, reuse one activation for a hundred thousand rounds."

[inputs]
source = "input.vib"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
