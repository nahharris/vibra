id = "V1-TOOL-format-types-order"
rule = "V1-TOOL"
profile = "tooling-v1"
operation = "format"
description = "The formatter moves types: before every ordinary operand, and the checker warns only after the application binds completely."

[inputs]
source = "tree/src/hello/main.vib"
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
formatted = "formatted.vib"

[[expect.diagnostics]]
code = "@style.argument-order"
level = "@warning"
source = "src/hello/main.vib"

[expect.diagnostics.span]
start = 18
end = 70
