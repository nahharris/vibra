id = "V1-PROJECT-workspace-check-binding-shadow"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "Workspace check reports each name that shadows a non-constant module value once, relating that value, as the single-source checker does."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = [67, 72]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [23, 44]

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = [115, 120]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [23, 44]
