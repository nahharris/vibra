id = "V1-PROJECT-workspace-check-binding-shadow"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "Workspace check reports each shadowing binder once, relating its nearest earlier introduction, as the single-source checker does."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = [32, 37]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [0, 17]

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = [52, 57]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [32, 37]
