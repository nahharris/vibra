id = "V1-RUNTIME-fs-error-propagates-with-try"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "A typed fs error reaches the program only as the err of its own call: try returns it from the entry, so the write after it never runs, the trace holds the one completed call, and the entry ends with the program-failed outcome and the error as its result."

[inputs]
project = "tree/project.vibon"
tree = "tree"
host-world = "world.vibon"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
