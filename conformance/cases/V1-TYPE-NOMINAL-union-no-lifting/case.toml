id = "V1-TYPE-NOMINAL-union-no-lifting"
rule = "V1-TYPE-NOMINAL"
profile = "static-v1"
operation = "type-check"
description = "A union lifts no member method from its members, and it is not a dict key without its own implementations."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.invalid-dict-key"
level = "@error"
source = "input.vib"
span = [131, 137]

[[expect.diagnostics]]
code = "@name.unknown-symbol"
level = "@error"
source = "input.vib"
span = [70, 88]
