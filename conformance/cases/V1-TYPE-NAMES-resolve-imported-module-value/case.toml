id = "V1-TYPE-NAMES-resolve-imported-module-value"
rule = "V1-TYPE-NAMES-resolution"
profile = "static-v1"
operation = "resolve"
description = "A bare imported module alias in a body is a wrong entity kind."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.wrong-entity-kind"
level = "@error"
source = "src/main.vib"
span = [40, 43]

  [[expect.diagnostics.related]]
  source = "src/lib.vib"
  span = [0, 0]
