id = "V1-TYPE-NAMES-binding-indirect-cycle"
rule = "V1-TYPE-NAMES"
profile = "static-v1"
operation = "workspace-check"
description = "A module initializer cycle reached through a fixed call is rejected before lowering."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.initializer-cycle"
level = "@error"
source = "src/app/main.vib"
span = [0, 22]
