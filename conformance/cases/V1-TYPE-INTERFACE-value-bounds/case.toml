id = "V1-TYPE-INTERFACE-value-bounds"
rule = "V1-TYPE-INTERFACE"
profile = "static-v1"
operation = "workspace-check"
description = "A bounded function or lambda named as a value has its bound checked at the type its expected fn type fixes, a default member's own bound is checked at each call, and that bound must name an interface."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.unknown-symbol"
level = "@error"
source = "src/app/main.vib"
span = [280, 289]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "src/app/main.vib"
span = [511, 515]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "src/app/main.vib"
span = [570, 628]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "src/app/main.vib"
span = [678, 711]
