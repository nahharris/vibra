id = "V1-EFFECT-atom-in-row"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "workspace-check"
description = "A source effect row never contains an atom; an atom entry is an invalid reference at that entry."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@effect.invalid-reference"
level = "@error"
source = "src/app/main.vib"
span = [82, 88]
