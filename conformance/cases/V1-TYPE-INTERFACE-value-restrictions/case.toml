id = "V1-TYPE-INTERFACE-value-restrictions"
rule = "V1-TYPE-INTERFACE"
profile = "static-v1"
operation = "workspace-check"
description = "An interface value is opaque: any cannot be inspected or dispatched on, an interface value does not satisfy a generic bound, and a member with another self operand cannot be called through one."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "src/app/main.vib"
span = [247, 251]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "src/app/main.vib"
span = [316, 321]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "src/app/main.vib"
span = [359, 374]

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "src/app/main.vib"
span = [457, 462]
