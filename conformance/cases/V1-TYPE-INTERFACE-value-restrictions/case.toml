id = "V1-TYPE-INTERFACE-value-restrictions"
rule = "V1-TYPE-INTERFACE"
profile = "static-v1"
operation = "type-check"
description = "An interface value is opaque: any cannot be inspected or dispatched on, an interface value does not satisfy a generic bound, and a member with another self operand cannot be called through one."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "input.vib"
span = [282, 286]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "input.vib"
span = [351, 356]

[[expect.diagnostics]]
code = "@type.unsatisfied-bound"
level = "@error"
source = "input.vib"
span = [394, 409]

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "input.vib"
span = [492, 497]
