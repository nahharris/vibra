id = "V1-TYPE-NAMES-vocabulary-binders"
rule = "V1-TYPE-NAMES"
profile = "static-v1"
operation = "type-check"
description = "Every name of the closed import-free vocabulary, a value or a type, is a reserved spelling at a binder site: a labelled or variadic parameter named true or false, and a let-else binder named option, are @name.reserved-declaration at the name. A positional or let pattern spelled true is a value pattern, not a binder, so it is refutable: @pattern.refutable-binding."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.reserved-declaration"
level = "@error"
source = "input.vib"
span = [40, 45]

[[expect.diagnostics]]
code = "@name.reserved-declaration"
level = "@error"
source = "input.vib"
span = [105, 109]

[[expect.diagnostics]]
code = "@name.reserved-declaration"
level = "@error"
source = "input.vib"
span = [200, 206]

[[expect.diagnostics]]
code = "@pattern.refutable-binding"
level = "@error"
source = "input.vib"
span = [283, 287]
