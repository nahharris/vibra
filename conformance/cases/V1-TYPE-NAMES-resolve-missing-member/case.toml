id = "V1-TYPE-NAMES-resolve-missing-member"
rule = "V1-TYPE-NAMES-resolution"
profile = "static-v1"
operation = "resolve"
description = "A known module with a missing imported member reports an unknown symbol."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.unknown-symbol"
level = "@error"
source = "src/main.vib"
span = [0, 29]
