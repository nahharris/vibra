id = "V1-EFFECT-private-operation-import"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "workspace-check"
description = "An operation is private unless it writes visibility: @public, as a deftype member is: applying a private operation of a public root from another module is private access at the reference."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.private-access"
level = "@error"
source = "src/app/main.vib"
span = [78, 92]

  [[expect.diagnostics.related]]
  source = "src/ops/log.vib"
  span = [39, 73]
