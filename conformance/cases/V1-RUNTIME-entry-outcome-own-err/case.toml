id = "V1-RUNTIME-entry-outcome-own-err"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "An entry that writes a line and then returns an error of its own ends the run with the program-failed outcome: the result observation holds the err as a value, the trace holds the one completed call, and the case expects no trap and no diagnostic."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
