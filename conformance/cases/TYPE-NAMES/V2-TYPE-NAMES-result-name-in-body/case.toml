id = "V2-TYPE-NAMES-result-name-in-body"
rule = "V2-TYPE-NAMES-result-name-in-body"
profile = "staticV2"
operation = "resolve"
description = "01-source-language.md#fn-and-proc: the result name is not visible in the body; the use is @name.unknownSymbol"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
