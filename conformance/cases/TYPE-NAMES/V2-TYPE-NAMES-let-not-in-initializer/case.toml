id = "V2-TYPE-NAMES-let-not-in-initializer"
rule = "V2-TYPE-NAMES-let-not-in-initializer"
profile = "staticV2"
operation = "resolve"
description = "01-source-language.md#bodies-and-statements: a let's names are not visible in its initializer; the use is @name.unknownSymbol"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@name.unknownSymbol"
level = "@error"
source = "src/app/main.vib"
span = { start = 40, end = 41 }
