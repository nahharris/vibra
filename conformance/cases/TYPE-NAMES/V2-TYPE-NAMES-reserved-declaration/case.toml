id = "V2-TYPE-NAMES-reserved-declaration"
rule = "V2-TYPE-NAMES-reserved-declaration"
profile = "staticV2"
operation = "resolve"
description = "02-type-system.md#the-prelude: a type declared with a prelude type name is @name.reservedDeclaration"

