id = "V2-TYPE-NAMES-shadow-module"
rule = "V2-TYPE-NAMES-shadow-module"
profile = "staticV2"
operation = "resolve"
description = "01-source-language.md#patterns: a binder may not shadow a module value; a name resolving to a module value whose initializer is not constant is @name.redeclaration, related to the declaration"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = { start = 121, end = 126 }
related = [{ source = "src/app/main.vib", span = { start = 57, end = 62 } }]
