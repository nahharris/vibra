id = "V1-RUNTIME-literal-patterns"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "interpret"
description = "A literal pattern compares a scalar of every width, a character, a text, and an atom by value, and the first arm that matches wins."

