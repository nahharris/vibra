id = "V1-TYPE-CONTROL-let-else-patterns"
rule = "V1-TYPE-CONTROL"
profile = "static-v1"
operation = "type-check"
description = "A let-else pattern must be refutable; an irrefutable one is reported at the pattern and names let."

[inputs]
source = "input.vib"

[expect]
accepted = false

