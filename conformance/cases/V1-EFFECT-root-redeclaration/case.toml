id = "V1-EFFECT-root-redeclaration"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "workspace-check"
description = "Effect roots share the module namespace: two roots of one spelling, and a root and a function of one spelling, are @name.redeclaration."

