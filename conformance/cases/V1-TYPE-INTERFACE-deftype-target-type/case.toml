id = "V1-TYPE-INTERFACE-deftype-target-type"
rule = "V1-TYPE-INTERFACE"
profile = "static-v1"
operation = "type-check"
description = "An impl block nested in a deftype targets an interface, not a type."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
