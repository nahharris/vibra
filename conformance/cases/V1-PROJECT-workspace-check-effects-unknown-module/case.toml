id = "V1-PROJECT-workspace-check-effects-unknown-module"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "An atom of a target array whose module does not exist is the ordinary @module.unknown-path at the atom, in project.vibon."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@module.unknown-path"
level = "@error"
source = "project.vibon"
span = [209, 227]
