id = "V2-TYPE-NOMINAL-record-missing-field"
rule = "V2-TYPE-NOMINAL-record-missing-field"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#application: a constructor that binds no argument to a field is an argument mismatch at the application"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.argumentMismatch"
level = "@error"
source = "src/app/main.vib"
span = { start = 75, end = 92 }
