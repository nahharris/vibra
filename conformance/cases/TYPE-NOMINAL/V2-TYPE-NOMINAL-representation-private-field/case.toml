id = "V2-TYPE-NOMINAL-representation-private-field"
rule = "V2-TYPE-NOMINAL-representation-private-field"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#representation-visibility: a field of a private representation cannot be read from another module; the use is reported at the field name, as a field read is"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@name.inaccessibleRepresentation"
level = "@error"
source = "src/app/main.vib"
span = { start = 82, end = 83 }
related = [{ source = "src/app/model.vib", span = { start = 5, end = 10 } }]
