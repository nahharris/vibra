id = "V2-TYPE-NOMINAL-record-type-repeated-field"
rule = "V2-TYPE-NOMINAL-record-type-repeated-field"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#structural-types: a record type that writes a field twice is @name.redeclaration at the later field, related to the earlier"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = { start = 23, end = 24 }
related = [{ source = "src/app/main.vib", span = { start = 16, end = 17 } }]
