id = "V1-RUNTIME-direct-calls"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "interpret"
description = "Direct calls in operand position pass operands of every class in order, a labelled operand takes its slot, a function returns early from inside a conditional, and bindings hold values across calls."

[inputs]
source = "input.vib"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
