id = "V2-TYPE-INTERFACE-unknown-member"
rule = "V2-TYPE-INTERFACE-unknown-member"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#implementations: an impl member whose name is no member of the interface is @name.unknownSymbol at the name"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@name.unknownSymbol"
level = "@error"
source = "src/app/main.vib"
span = { start = 295, end = 299 }
