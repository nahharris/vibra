id = "V2-TYPE-INTERFACE-missing-member"
rule = "V2-TYPE-INTERFACE-missing-member"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#implementations: an impl that does not supply an abstract member is @type.missingAbstractMember at the impl head, related to the member"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.missingAbstractMember"
level = "@error"
source = "src/app/main.vib"
span = { start = 171, end = 185 }
related = [{ source = "src/app/main.vib", span = { start = 70, end = 76 } }]
