id = "V2-TYPE-INTERFACE-labelled-type-differs"
rule = "V2-TYPE-INTERFACE-labelled-type-differs"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#implementations: a labelled parameter whose type differs under the substitution is @type.mismatch at that type, related to the contract member"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "src/app/main.vib"
span = { start = 250, end = 253 }
related = [{ source = "src/app/main.vib", span = { start = 64, end = 67 } }]
