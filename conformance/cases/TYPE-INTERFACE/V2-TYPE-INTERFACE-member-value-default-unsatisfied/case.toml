id = "V2-TYPE-INTERFACE-member-value-default-unsatisfied"
rule = "V2-TYPE-INTERFACE-member-value-default-unsatisfied"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#functions-as-values: a default member named as a value at a receiver with no implementation is @type.unsatisfiedBound, related to the interface"

[inputs]
