id = "V2-TYPE-INTERFACE-assoc-twice"
rule = "V2-TYPE-INTERFACE-assoc-twice"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#associated-types: an associated type chosen twice is @name.redeclaration at the later choice, related to the first"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = { start = 118, end = 122 }
related = [{ source = "src/app/main.vib", span = { start = 90, end = 94 } }]
