id = "V2-TYPE-INTERFACE-impl-encodable"
rule = "V2-TYPE-INTERFACE-impl-encodable"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#implementations: every type that conforms to Encodable does so without an implementation, so an impl whose target is Encodable is @type.redundantImplementation at the target"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.redundantImplementation"
level = "@error"
source = "src/app/main.vib"
span = { start = 23, end = 32 }
