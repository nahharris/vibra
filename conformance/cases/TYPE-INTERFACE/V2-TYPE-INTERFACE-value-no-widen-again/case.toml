id = "V2-TYPE-INTERFACE-value-no-widen-again"
rule = "V2-TYPE-INTERFACE-value-no-widen-again"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#widening: an interface value never widens again, even to Any, so it is @type.mismatch"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "src/app/main.vib"
span = { start = 114, end = 115 }
