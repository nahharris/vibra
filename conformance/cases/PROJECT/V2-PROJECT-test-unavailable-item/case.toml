id = "V2-PROJECT-test-unavailable-item"
rule = "V2-PROJECT-test-unavailable-item"
profile = "interpreterV2"
operation = "workspaceTest"
description = "05-tooling.md#tests-and-selection: a test whose declarations reach an unsupported form is unavailable and the other test runs"

[inputs]
tree = "tree"
project = "tree/project.vibon"

