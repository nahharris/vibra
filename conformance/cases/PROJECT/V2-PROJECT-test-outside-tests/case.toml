id = "V2-PROJECT-test-outside-tests"
rule = "V2-PROJECT-test-outside-tests"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#tests: a test declared in a target module is rejected"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@module.testOutsideTests"
level = "@error"
source = "src/app/main.vib"
span = { start = 24, end = 47 }
