id = "V2-PROJECT-path-dependency-undeclared"
rule = "V2-PROJECT-path-dependency-undeclared"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#packages-units-and-targets: an import of a unit the project does not declare is @module.unknownPath at the import, though the package is in the tree"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@module.unknownPath"
level = "@error"
source = "src/app/main.vib"
span = { start = 4, end = 17 }
