id = "V2-PROJECT-assert-value-outside-tests"
rule = "V2-PROJECT-assert-value-outside-tests"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#assertions: an assertion used as a value outside @tests is rejected at the use"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@module.assertionOutsideTests"
level = "@error"
source = "src/app/main.vib"
span = { start = 100, end = 111 }
