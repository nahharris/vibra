id = "V2-PROJECT-import-cycle"
rule = "V2-PROJECT-import-cycle"
profile = "staticV2"
operation = "resolve"
description = "04-programs-and-packages.md#modules-and-imports: an import that closes a cycle is @module.importCycle at the later edge, related along the cycle"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@module.importCycle"
level = "@error"
source = "src/app/b.vib"
span = { start = 4, end = 10 }
related = [{ source = "src/app/a.vib", span = { start = 4, end = 10 } }]
