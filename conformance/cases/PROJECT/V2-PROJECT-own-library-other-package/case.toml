id = "V2-PROJECT-own-library-other-package"
rule = "V2-PROJECT-own-library-other-package"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#packages-units-and-targets: a binary target cannot name a library target of another local package that its project does not declare; the import is @module.unknownPath"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@module.unknownPath"
level = "@error"
source = "src/hello/main.vib"
span = { start = 69, end = 83 }
