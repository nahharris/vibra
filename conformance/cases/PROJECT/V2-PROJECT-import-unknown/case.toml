id = "V2-PROJECT-import-unknown"
rule = "V2-PROJECT-import-unknown"
profile = "staticV2"
operation = "resolve"
description = "04-programs-and-packages.md#modules-and-imports: a locator that reaches no module is @module.unknownPath"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@module.unknownPath"
level = "@error"
source = "src/app/main.vib"
span = { start = 4, end = 16 }
