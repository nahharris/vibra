id = "V2-PROJECT-decode-opaque-out-of-range"
rule = "V2-PROJECT-decode-opaque-out-of-range"
profile = "staticV2"
operation = "projectDecode"
description = "04-programs-and-packages.md#schemas: a number in opaque data outside the range of its written type is a value fault at the number"

[inputs]
