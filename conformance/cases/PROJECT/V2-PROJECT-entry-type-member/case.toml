id = "V2-PROJECT-entry-type-member"
rule = "V2-PROJECT-entry-type-member"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#targets: the entry is a module-level proc, not a member of a type"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@project.invalidEntrySignature"
level = "@error"
source = "project.vibon"
span = { start = 119, end = 138 }
related = [{ source = "src/app/main.vib", span = { start = 56, end = 61 } }]
