id = "V2-PROJECT-import-tests-from-target"
rule = "V2-PROJECT-import-tests-from-target"
profile = "staticV2"
operation = "resolve"
description = "04-programs-and-packages.md#packages-units-and-targets: a target does not name the @tests unit; the import is @module.unknownPath"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@module.unknownPath"
level = "@error"
source = "src/app/main.vib"
span = { start = 4, end = 12 }
