id = "V2-PROJECT-path-dependency-private"
rule = "V2-PROJECT-path-dependency-private"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#modules-and-imports: an import of a private declaration of a dependency is @name.privateAccess, related to the declaration"

[inputs]
