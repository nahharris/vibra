id = "V2-PROJECT-test-exhaustion-isolated"
rule = "V2-PROJECT-test-exhaustion-isolated"
profile = "interpreterV2"
operation = "workspaceTest"
description = "04-programs-and-packages.md#tests: a test that exhausts memory is @test.exhausted, the other test keeps its result, and the suite is an operational failure"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "unknown"
hostEvent = "@runtime.memoryExhausted"
testRun = "test-run.vibon"

[[expect.diagnostics]]
code = "@runtime.memoryExhausted"
level = "@error"
span = { start = 0, end = 0 }
