id = "V2-PROJECT-entry-unknown"
rule = "V2-PROJECT-entry-unknown"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#targets: an entry that resolves to nothing is @name.unknownSymbol at the field"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@name.unknownSymbol"
level = "@error"
source = "project.vibon"
span = { start = 119, end = 133 }
