id = "V2-PROJECT-dependency-named-std"
rule = "V2-PROJECT-dependency-named-std"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#packages-units-and-targets: a dependency keyed std is @project.reservedUnitName at the key"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@project.reservedUnitName"
level = "@error"
source = "project.vibon"
span = { start = 127, end = 132 }
