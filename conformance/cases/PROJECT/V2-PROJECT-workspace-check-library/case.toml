id = "V2-PROJECT-workspace-check-library"
rule = "V2-PROJECT-workspace-check-library"
profile = "staticV2"
operation = "workspaceCheck"
description = "05-tooling.md#command-surface: a library target and its imports are checked; the types snapshot lists every callable"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "accepted"
types = "types.vibon"
