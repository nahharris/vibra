id = "V2-PROJECT-git-dependency-unavailable"
rule = "V2-PROJECT-git-dependency-unavailable"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#dependencies-and-lock: a @git dependency is @tool.unavailable at its entry and no lock is read (Q23)"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "unsupported"

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
source = "project.vibon"
span = { start = 127, end = 233 }
