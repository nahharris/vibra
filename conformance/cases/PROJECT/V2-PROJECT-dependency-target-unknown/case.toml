id = "V2-PROJECT-dependency-target-unknown"
rule = "V2-PROJECT-dependency-target-unknown"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#dependencies-and-lock: a dependency key that names no target of the package is @name.unknownSymbol at the key"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@name.unknownSymbol"
level = "@error"
source = "project.vibon"
span = { start = 127, end = 134 }
