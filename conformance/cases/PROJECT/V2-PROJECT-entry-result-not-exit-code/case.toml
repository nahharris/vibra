id = "V2-PROJECT-entry-result-not-exit-code"
rule = "V2-PROJECT-entry-result-not-exit-code"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#targets: the result type of an entry is ExitCode"

[inputs]
tree = "tree"
