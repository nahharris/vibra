id = "V2-PROJECT-dependency-transitive-not-visible"
rule = "V2-PROJECT-dependency-transitive-not-visible"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#packages-units-and-targets: a dependency of a dependency is in the snapshot and not visible from the root: @module.unknownPath at the import"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@module.unknownPath"
level = "@error"
source = "src/app/main.vib"
span = { start = 4, end = 16 }
