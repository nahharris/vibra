id = "V1-EFFECT-unknown-symbol-in-row"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "type-check"
description = "A row entry that names nothing, and one that names a function and not an effect root, are each an invalid reference at that entry."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@effect.invalid-reference"
level = "@error"
source = "input.vib"
span = [56, 63]

[[expect.diagnostics]]
code = "@effect.invalid-reference"
level = "@error"
source = "input.vib"
span = [64, 70]
