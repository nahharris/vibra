id = "V1-TOOL-index-unavailable"
rule = "V1-TOOL"
profile = "tooling-v1"
operation = "index"
description = "A declaration that does not check keeps its index record without checked facts: an effect root and its @host operation, whose symbol names no registry row, and a function whose signature names an unknown type."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false
index = "index.vibon"

[[expect.diagnostics]]
code = "@external.unknown-symbol"
level = "@error"
source = "src/app/main.vib"
span = [81, 95]

[[expect.diagnostics]]
code = "@name.unknown-symbol"
level = "@error"
source = "src/app/main.vib"
span = [114, 127]
