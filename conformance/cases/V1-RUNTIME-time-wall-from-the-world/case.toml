id = "V1-RUNTIME-time-wall-from-the-world"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "The wall clock of a world is constant: every read answers the world's wall, in nanoseconds since the epoch."

[inputs]
project = "tree/project.vibon"
tree = "tree"
host-world = "world.vibon"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
