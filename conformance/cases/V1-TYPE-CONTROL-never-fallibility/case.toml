id = "V1-TYPE-CONTROL-never-fallibility"
rule = "V1-TYPE-CONTROL"
profile = "static-v1"
operation = "type-check"
description = "A result whose error type is uninhabited is not fallible; any other result still is, and try is unchanged for it."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.unhandled-fallible"
level = "@error"
source = "input.vib"
span = [255, 268]

[[expect.diagnostics]]
code = "@type.unhandled-fallible"
level = "@error"
source = "input.vib"
span = [306, 324]
