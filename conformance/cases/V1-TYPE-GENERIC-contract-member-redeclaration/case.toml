id = "V1-TYPE-GENERIC-contract-member-redeclaration"
rule = "V1-TYPE-GENERIC"
profile = "static-v1"
operation = "type-check"
description = "A contract member's own generic parameter MUST NOT reuse a name its interface declares: the member redeclares an inherited generic and each generic name keeps one declaration site. A member whose generic is named differently is not a redeclaration."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.generic-redeclaration"
level = "@error"
source = "input.vib"
span = [94, 95]
