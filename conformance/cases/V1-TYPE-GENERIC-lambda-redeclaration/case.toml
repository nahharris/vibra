id = "V1-TYPE-GENERIC-lambda-redeclaration"
rule = "V1-TYPE-GENERIC"
profile = "static-v1"
operation = "workspace-check"
description = "A lambda must not redeclare a generic name of an enclosing declaration."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.generic-redeclaration"
level = "@error"
source = "src/app/main.vib"
span = [95, 96]
