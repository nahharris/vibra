id = "V1-TYPE-INTERFACE-defint-target-interface"
rule = "V1-TYPE-INTERFACE"
profile = "static-v1"
operation = "type-check"
description = "An impl block nested in a defint targets a concrete type, not an interface."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.wrong-entity-kind"
level = "@error"
source = "input.vib"
span = [95, 146]
