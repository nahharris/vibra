id = "V1-PROJECT-entry-never"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "never is neither void nor a result, so an entry that returns it is not an entry signature."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@project.invalid-entry-signature"
level = "@error"
source = "project.vibon"
span = [145, 162]
