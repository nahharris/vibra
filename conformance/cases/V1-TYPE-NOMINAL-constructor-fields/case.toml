id = "V1-TYPE-NOMINAL-constructor-fields"
rule = "V1-TYPE-NOMINAL"
profile = "static-v1"
operation = "workspace-check"
description = "A record constructor takes exactly its closed set of labelled fields: missing, duplicate, unknown, and positional operands are argument mismatches."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false



