id = "V1-TYPE-NOMINAL-dict-keys-nested"
rule = "V1-TYPE-NOMINAL"
profile = "static-v1"
operation = "workspace-check"
description = "A single-precision float key and a function nested in a tuple key are rejected like their double-precision and bare forms."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.invalid-dict-key"
level = "@error"
source = "src/app/main.vib"
span = [28, 31]

[[expect.diagnostics]]
code = "@type.function-not-equatable"
level = "@error"
source = "src/app/main.vib"
span = [81, 104]
