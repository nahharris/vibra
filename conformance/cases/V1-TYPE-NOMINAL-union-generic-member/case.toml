id = "V1-TYPE-NOMINAL-union-generic-member"
rule = "V1-TYPE-NOMINAL"
profile = "static-v1"
operation = "type-check"
description = "A member of an anonymous union names no generic parameter, in a field, a parameter, and a result, and an anonymous union takes part in the finite-size check like a record or an enum."

[inputs]
source = "input.vib"

[expect]
accepted = false

