id = "V2-SRC-READER-closer-eof"
rule = "V2-SRC-READER-closer-eof"
profile = "readerV2"
operation = "reader"
description = "07-diagnostics-and-conformance.md#recovery: a construct still open at the end of the file is an unmatched delimiter at its opener"

[inputs]
source = "input.vib"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@syntax.unmatchedDelimiter"
level = "@error"
span = { start = 0, end = 2 }

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
span = { start = 0, end = 4 }
