id = "V1-TYPE-CONTROL-let-else-fallbacks"
rule = "V1-TYPE-CONTROL"
profile = "static-v1"
operation = "type-check"
description = "A let-else fallback must have type never: a return, a call of a never function, an if of such, or a do ending in one."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "input.vib"
span = [507, 511]
