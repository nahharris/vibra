id = "V1-RUNTIME-workspace-run-effect-operations"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "A binary target whose entry applies an operation of an imported module runs: the operation is an ordinary function with a Vibra body in another module, and its owner and additive roots are in the entry's written ceiling and in the target array."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
