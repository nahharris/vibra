id = "V1-PROJECT-workspace-check-closure-global-initializer-cycle"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "A workspace check rejects an initializer cycle through a closure-valued global before any entry can run."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.initializer-cycle"
level = "@error"
source = "src/demo/main.vib"
span = [38, 53]
