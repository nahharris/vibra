id = "V1-EFFECT-target-array-entry-over-own-ceiling"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "workspace-check"
description = "An entry whose own ceiling omits its performed roots is rejected by the ordinary ceiling rule at the call site, one diagnostic for each missing root, and a complete array adds no diagnostic of its own."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@effect.outside-ceiling"
level = "@error"
source = "src/app/main.vib"
span = [47, 76]
notes = ["performs @ops.log.audit via @ops.log.audit.record"]

[[expect.diagnostics]]
code = "@effect.outside-ceiling"
level = "@error"
source = "src/app/main.vib"
span = [47, 76]
notes = ["performs @ops.log.write via @ops.log.audit.record"]

  [[expect.diagnostics.related]]
  source = "src/ops/log.vib"
  span = [223, 242]
  message = "performs @ops.log.write via @ops.log.write.text"
