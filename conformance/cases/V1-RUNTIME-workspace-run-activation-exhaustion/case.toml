id = "V1-RUNTIME-workspace-run-activation-exhaustion"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "A binary target whose entry recurses without a base case ends the workspace run with the memory host event, not with a program result or a trap."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
host_event = "@runtime.memory-exhausted"
