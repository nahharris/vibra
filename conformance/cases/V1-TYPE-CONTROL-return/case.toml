id = "V1-TYPE-CONTROL-return"
rule = "V1-TYPE-CONTROL"
profile = "static-v1"
operation = "workspace-check"
description = "return exits the innermost defn, nested method, or lambda at the written result type; its operand may not be a diverging expression."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "src/app/main.vib"
span = [593, 596]

[[expect.diagnostics]]
code = "@type.unreachable-code"
level = "@error"
source = "src/app/main.vib"
span = [658, 664]
