id = "V1-PROJECT-workspace-check-effects-tests-unit"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "The reserved @tests unit is nameable only from test modules, and project.vibon is not one: an array atom under it is @module.unknown-path, as an import of it from a target module is."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@module.unknown-path"
level = "@error"
source = "project.vibon"
span = [179, 199]
