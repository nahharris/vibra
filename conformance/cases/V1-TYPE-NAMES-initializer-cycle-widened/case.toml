id = "V1-TYPE-NAMES-initializer-cycle-widened"
rule = "V1-TYPE-NAMES"
profile = "static-v1"
operation = "type-check"
description = "A module-value cycle through a call whose result is widened is detected."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.initializer-cycle"
level = "@error"
source = "input.vib"
span = [52, 83]
