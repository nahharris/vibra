id = "V1-RUNTIME-workspace-run-higher-order-entry"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "The workspace runner selects the declared entry when a preceding helper accepts a known lambda."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
