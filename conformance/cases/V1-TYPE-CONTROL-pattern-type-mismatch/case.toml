id = "V1-TYPE-CONTROL-pattern-type-mismatch"
rule = "V1-TYPE-CONTROL"
profile = "static-v1"
operation = "type-check"
description = "A pattern whose shape disagrees with the scrutinee or parameter type is a type mismatch."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "input.vib"
span = [88, 92]

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "input.vib"
span = [123, 138]

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "input.vib"
span = [197, 217]
