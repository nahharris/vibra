id = "V1-SRC-READER-mixed-diagnostic-order"
rule = "V1-SRC-READER"
profile = "reader-v1"
description = "Lexer and parser recovery diagnostics are ordered by primary source span."

[inputs]
source = "input.vib"

[expect]
accepted = false
formatted = "formatted.vib"

[[expect.diagnostics]]
code = "@syntax.unmatched-delimiter"
level = "@error"

[expect.diagnostics.span]
start = 0
end = 1

[[expect.diagnostics]]
code = "@syntax.missing-separator"
level = "@error"

[expect.diagnostics.span]
start = 4
end = 4

[[expect.diagnostics]]
code = "@syntax.unmatched-delimiter"
level = "@error"

[expect.diagnostics.span]
start = 13
end = 13

[[expect.diagnostics]]
code = "@syntax.unmatched-delimiter"
level = "@error"

[expect.diagnostics.span]
start = 13
end = 13
