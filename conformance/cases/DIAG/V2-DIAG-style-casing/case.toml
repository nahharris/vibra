id = "V2-DIAG-style-casing"
rule = "V2-DIAG-style-casing"
profile = "staticV2"
operation = "resolve"
description = "01-source-language.md#identifiers: a type name in camelCase is the warning @style.casing and the case is accepted"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "accepted"

[[expect.diagnostics]]
code = "@style.casing"
level = "@warning"
source = "src/app/main.vib"
span = { start = 5, end = 9 }
