id = "V1-RUNTIME-io-write-text-and-bytes"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "An entry writes text with non-ASCII scalars and arbitrary bytes to standard output and standard error and propagates each result with try. The writes are the arguments of four audit events in call order, each with the result of a completed call that has a void payload, and nothing reaches the process."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
