id = "V1-RUNTIME-io-stdin-text-twice"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "Standard input is read whole from the current position, so the first read returns the world's text and the second returns the empty text; each completed call is one event."

[inputs]
project = "tree/project.vibon"
tree = "tree"
host-world = "world.vibon"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
