id = "V1-TYPE-INFER-range-errors"
rule = "V1-TYPE-INFER"
profile = "static-v1"
operation = "type-check"
description = "Every fixed-width primitive range rejects one value below and above its boundary, including negative unsigned and oversized digits."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.numeric-out-of-range"
level = "@error"
source = "input.vib"
span = [21, 25]

