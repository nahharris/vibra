id = "V1-RUNTIME-workspace-test-iter-defaults"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-test"
description = "The iter defaults map, filter, skip, take, and collect run over each builtin conformance and a user iterator: map changes the element type, and take over an infinite iterator shows the adapters are lazy."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
interpreter = { result = "result.vibon" }
