id = "V1-TYPE-NAMES-resolve-declaration-as-module"
rule = "V1-TYPE-NAMES-resolution"
profile = "static-v1"
operation = "resolve"
description = "A declaration import binds one top-level declaration, so importing a private one is private access at the import."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false
[[expect.diagnostics]]
code = "@name.private-access"
level = "@error"
source = "src/main.vib"
span = [0, 24]



  [[expect.diagnostics.related]]
  source = "src/lib.vib"
  span = [0, 23]
