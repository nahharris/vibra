id = "V1-EFFECT-host-owner-mismatch"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "workspace-check"
description = "A @host member whose registry row is owned by another root is rejected at its symbol string and relates the enclosing deffect: io.stdout-text belongs to @std.io.stdout, so no deffect of a user module can bind it."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@external.owner-mismatch"
level = "@error"
source = "src/app/main.vib"
span = [121, 137]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [30, 37]
  message = "the enclosing deffect"
