id = "V1-TYPE-CONTROL-redundant-return"
rule = "V1-TYPE-CONTROL"
profile = "static-v1"
operation = "workspace-check"
description = "A return in tail position is redundant, and a let-else fallback is not in tail position."

[inputs]
project = "tree/project.vibon"
tree = "tree"

