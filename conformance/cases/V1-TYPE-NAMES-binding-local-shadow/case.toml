id = "V1-TYPE-NAMES-binding-local-shadow"
rule = "V1-TYPE-NAMES"
profile = "static-v1"
operation = "workspace-check"
description = "A nested let binder reports the real earlier local binder span when shadowing is rejected."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = [52, 57]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [34, 39]
