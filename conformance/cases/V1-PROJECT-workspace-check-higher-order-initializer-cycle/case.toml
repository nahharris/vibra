id = "V1-PROJECT-workspace-check-higher-order-initializer-cycle"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "A library initializer cycle through a higher-order helper is rejected without an executable entry."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.initializer-cycle"
level = "@error"
source = "src/util/main.vib"
span = [0, 28]
