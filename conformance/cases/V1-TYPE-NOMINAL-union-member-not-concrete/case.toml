id = "V1-TYPE-NOMINAL-union-member-not-concrete"
rule = "V1-TYPE-NOMINAL"
profile = "static-v1"
operation = "type-check"
description = "A union member that is another union, declared or anonymous, or a bare generic name is not concrete."

