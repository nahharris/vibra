id = "V1-TYPE-NAMES-binding-shadow"
rule = "V1-TYPE-NAMES"
profile = "static-v1"
operation = "type-check"
description = "A let binder cannot shadow a visible parameter or module value."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "input.vib"
span = [32, 37]

  [[expect.diagnostics.related]]
  source = "input.vib"
  span = [0, 17]

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "input.vib"
span = [52, 57]

  [[expect.diagnostics.related]]
  source = "input.vib"
  span = [32, 37]
