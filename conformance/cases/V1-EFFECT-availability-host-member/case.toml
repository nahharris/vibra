id = "V1-EFFECT-availability-host-member"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "workspace-check"
description = "A @host member whose symbol is not a row of the host registry is rejected at its symbol string."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@external.unknown-symbol"
level = "@error"
source = "src/app/main.vib"
span = [81, 95]
