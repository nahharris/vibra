id = "V1-TYPE-CONVERT-ascription-through-forms"
rule = "V1-TYPE-CONVERT"
profile = "static-v1"
operation = "workspace-check"
description = "An ascription that fails through an if, a let, or a do reports one invalid ascription at the form, as a direct operand does."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.invalid-ascription"
level = "@error"
source = "src/app/main.vib"
span = [35, 63]

[[expect.diagnostics]]
code = "@type.invalid-ascription"
level = "@error"
source = "src/app/main.vib"
span = [93, 129]

[[expect.diagnostics]]
code = "@type.invalid-ascription"
level = "@error"
source = "src/app/main.vib"
span = [158, 176]
