id = "V1-TYPE-INTERFACE-redundant-implementation"
rule = "V1-TYPE-INTERFACE"
profile = "static-v1"
operation = "type-check"
description = "A defint cannot implement itself for a type declared in the same module; the deftype carries the block."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.redundant-implementation"
level = "@error"
source = "input.vib"
span = [83, 138]
