id = "V1-TYPE-CONTROL-invalid-try"
rule = "V1-TYPE-CONTROL"
profile = "static-v1"
operation = "workspace-check"
description = "try is invalid against a different error type, over a non-container, against a different container, and outside any function."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

