id = "V1-TYPE-NAMES-resolve-private-import"
rule = "V1-TYPE-NAMES-resolution"
profile = "static-v1"
operation = "resolve"
description = "An imported private declaration is rejected at the referring path."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.private-access"
level = "@error"
source = "src/main.vib"
span = [61, 71]

  [[expect.diagnostics.related]]
  source = "src/lib.vib"
  span = [0, 26]
