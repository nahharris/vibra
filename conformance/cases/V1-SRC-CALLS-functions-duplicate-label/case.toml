id = "V1-SRC-CALLS-functions-duplicate-label"
rule = "V1-SRC-CALLS"
profile = "static-v1"
operation = "workspace-check"
description = "Duplicate labelled operands are rejected before an application is lowered."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.argument-mismatch"
level = "@error"
source = "src/app/main.vib"
span = [20, 57]
