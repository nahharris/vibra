id = "V1-RUNTIME-workspace-run-unused-imported-higher-order-helper"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "An unused imported higher-order API and dead forwarding caller do not block the selected pure entry."

