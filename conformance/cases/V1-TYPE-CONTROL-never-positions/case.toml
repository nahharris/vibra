id = "V1-TYPE-CONTROL-never-positions"
rule = "V1-TYPE-CONTROL"
profile = "static-v1"
operation = "type-check"
description = "A never expression is admitted as a body element, an if branch, a match arm result, a let-else fallback, and a final expression, and is unreachable code anywhere else or after another never element."

