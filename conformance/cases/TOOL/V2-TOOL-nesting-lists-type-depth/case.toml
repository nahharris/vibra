id = "V2-TOOL-nesting-lists-type-depth"
rule = "V2-TOOL-nesting-lists-type-depth"
profile = "staticV2"
operation = "workspaceCheck"
description = "05-tooling.md#program-arguments-execution-and-evaluation: 65 nested lists are within the source nesting limit, and the type of 65 levels is still @type.depthExceeded (02-type-system.md#structural-types)"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.depthExceeded"
level = "@error"
source = "src/app/main.vib"
span = { start = 15, end = 147 }
