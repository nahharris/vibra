id = "V2-TOOL-unavailable-proc"
rule = "V2-TOOL-unavailable-proc"
profile = "staticV2"
operation = "workspaceCheck"
description = "07-diagnostics-and-conformance.md#runtime-and-tool-failures: a procedure is unavailable to this checker; the other declarations are checked"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "unsupported"
types = "types.vibon"

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
source = "src/app/main.vib"
span = { start = 48, end = 95 }
