id = "V2-TOOL-nesting-project-file"
rule = "V2-TOOL-nesting-project-file"
profile = "staticV2"
operation = "workspaceCheck"
description = "05-tooling.md#program-arguments-execution-and-evaluation: a project file is measured before it is decoded; a field value nested 1,025 levels is @tool.limitExceeded at its first token past the limit, the document's only diagnostic, and the outcome unknown"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "unknown"

[[expect.diagnostics]]
code = "@tool.limitExceeded"
level = "@error"
source = "project.vibon"
span = { start = 1163, end = 1164 }
