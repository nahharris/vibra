id = "V2-TOOL-unavailable-proc-row"
rule = "V2-TOOL-unavailable-proc-row"
profile = "staticV2"
operation = "workspaceCheck"
description = "03-effects.md#effect-ceilings: a proc row entry that names a plain type is an invalid reference at the entry"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@effect.invalidReference"
level = "@error"
source = "src/app/main.vib"
span = { start = 61, end = 68 }
