id = "V1-RUNTIME-workspace-run-tail-module-values"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "A call in tail position through a module value of function type reuses the activation in a workspace run, whether the value is a function or a contract member named as a value: ten thousand calls through each end without exhausting the interpreter's activation budget."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
