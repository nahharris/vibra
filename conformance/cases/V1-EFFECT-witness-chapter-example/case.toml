id = "V1-EFFECT-witness-chapter-example"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "type-check"
description = "The example of the effects chapter: an operation adds a root to its owner, so a caller that names only the owner is outside its ceiling, and the witness carries the additive root from the call of the operation down to the operation that owns it."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@effect.outside-ceiling"
level = "@error"
source = "input.vib"
span = [248, 277]
notes = ["performs @write via @audit.record"]

  [[expect.diagnostics.related]]
  source = "input.vib"
  span = [147, 172]
  message = "performs @write via @write.text"
