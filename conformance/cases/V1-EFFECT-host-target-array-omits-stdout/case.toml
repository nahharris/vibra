id = "V1-EFFECT-host-target-array-omits-stdout"
rule = "V1-EFFECT"
profile = "static-v1"
operation = "workspace-check"
description = "The target array is the user's consent: an entry that writes standard output through @std.io.stdout.text, with its ceiling written, is rejected at the entry value when the array omits @std.io.stdout. The witness is the one call that introduces the root."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@effect.outside-ceiling"
level = "@error"
source = "project.vibon"
span = [145, 159]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [86, 112]
  message = "performs @std.io.stdout via @std.io.stdout.text"
