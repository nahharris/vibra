id = "V1-RUNTIME-iter-skip-filter-depth"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "interpret"
description = "iter.skip and iter.filter pass over ten thousand items at constant depth, so skipping or filtering a long run does not exhaust the activation bound."

[inputs]
source = "input.vib"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
