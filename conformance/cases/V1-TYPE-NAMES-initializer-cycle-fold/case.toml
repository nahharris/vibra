id = "V1-TYPE-NAMES-initializer-cycle-fold"
rule = "V1-TYPE-NAMES"
profile = "static-v1"
operation = "type-check"
description = "A module-value cycle through the step function of array.fold is detected."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.initializer-cycle"
