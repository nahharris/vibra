id = "V1-TYPE-INFER-out-of-range"
rule = "V1-TYPE-INFER"
profile = "static-v1"
operation = "type-check"
description = "A primitive range failure rejects lowering and reports the literal span."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.numeric-out-of-range"
level = "@error"
source = "input.vib"
span = [16, 21]
