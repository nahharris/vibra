id = "V1-TYPE-INFER-out-of-range"
rule = "V1-TYPE-INFER"
profile = "static-v1"
operation = "workspace-check"
description = "A primitive range failure rejects lowering and reports the literal span."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.numeric-out-of-range"
level = "@error"
source = "src/app/main.vib"
span = [16, 21]
