id = "V1-RUNTIME-entry-outcome-memory-holding-err"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "An entry that holds an err and then recurses with no base case ends with the memory host event: a host event is never recast as a program failure, so the held err is never observed."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
host_event = "@runtime.memory-exhausted"
