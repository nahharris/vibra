id = "V1-TYPE-NOMINAL-names"
rule = "V1-TYPE-NOMINAL"
profile = "static-v1"
operation = "workspace-check"
description = "An unknown type name is reported at its owning parameter, and a constructor is not a value."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false



[[expect.diagnostics]]
code = "@name.unknown-symbol"
level = "@error"
source = "src/app/main.vib"
span = [46, 59]

[[expect.diagnostics]]
code = "@name.wrong-entity-kind"
level = "@error"
source = "src/app/main.vib"
span = [100, 105]

[[expect.diagnostics]]
code = "@name.wrong-entity-kind"
level = "@error"
source = "src/app/main.vib"
span = [144, 149]
