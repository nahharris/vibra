id = "V1-TYPE-GENERIC-constant-default-rejections"
rule = "V1-TYPE-GENERIC"
profile = "static-v1"
operation = "type-check"
description = "A labelled default written as a name must name a constant of a primitive type: a module value whose initializer is a call, or a function, is @syntax.invalid-form, which is what a default that is not a literal reported before names were admitted. A constant of another type is @type.mismatch, and an implementation member whose default is a different value than its contract's is @type.mismatch."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@syntax.invalid-form"
level = "@error"
source = "input.vib"
span = [114, 122]

[[expect.diagnostics]]
code = "@syntax.invalid-form"
level = "@error"
source = "input.vib"
span = [179, 182]

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "input.vib"
span = [229, 239]

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "input.vib"
span = [379, 457]
