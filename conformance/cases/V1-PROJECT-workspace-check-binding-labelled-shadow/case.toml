id = "V1-PROJECT-workspace-check-binding-labelled-shadow"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "Workspace check reports a shadowing labelled parameter at its name, matching the single-source checker."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = [60, 65]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [32, 37]

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = [75, 80]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [0, 17]
