id = "V2-TYPE-GENERIC-bound-in-bound-parameter"
rule = "V2-TYPE-GENERIC-bound-in-bound-parameter"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#bounds: a parameter passed to a bounded interface in a bound MUST itself carry a bound that satisfies it"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.unsatisfiedBound"
level = "@error"
source = "src/app/main.vib"
span = { start = 199, end = 200 }
related = [{ source = "src/app/main.vib", span = { start = 30, end = 37 } }]
