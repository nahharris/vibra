id = "V2-TYPE-GENERIC-bounded-type-result"
rule = "V2-TYPE-GENERIC-bounded-type-result"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#generics: an application of a bounded declared type in a result type is @type.unsatisfiedBound at the argument, related to the bound"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.unsatisfiedBound"
level = "@error"
source = "src/app/main.vib"
span = { start = 111, end = 116 }
related = [{ source = "src/app/main.vib", span = { start = 38, end = 45 } }]
