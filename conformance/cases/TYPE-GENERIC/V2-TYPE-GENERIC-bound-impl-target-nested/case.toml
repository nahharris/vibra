id = "V2-TYPE-GENERIC-bound-impl-target-nested"
rule = "V2-TYPE-GENERIC-bound-impl-target-nested"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#implementations: an impl target argument applied to another type is checked against its parameter's bound as a whole"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.unsatisfiedBound"
level = "@error"
source = "src/app/main.vib"
span = { start = 169, end = 180 }
related = [{ source = "src/app/main.vib", span = { start = 30, end = 37 } }]
