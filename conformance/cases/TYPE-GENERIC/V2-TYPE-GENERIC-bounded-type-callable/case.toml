id = "V2-TYPE-GENERIC-bounded-type-callable"
rule = "V2-TYPE-GENERIC-bounded-type-callable"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#generics: an application of a bounded declared type in a callable type is @type.unsatisfiedBound at the argument, related to the bound"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.unsatisfiedBound"
level = "@error"
source = "src/app/main.vib"
