id = "V2-TYPE-GENERIC-expanding-default"
rule = "V2-TYPE-GENERIC-expanding-default"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#generics: a default member whose call on Self reaches the default again at a larger member argument expands without end, at the call"

