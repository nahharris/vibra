id = "V2-TYPE-GENERIC-bound-linked-conflict"
rule = "V2-TYPE-GENERIC-bound-linked-conflict"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#bounds: a choice that disagrees with what the expected type fixes is @type.mismatch at the operand"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "src/app/main.vib"
span = { start = 64, end = 75 }
