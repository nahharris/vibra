id = "V2-TYPE-GENERIC-bound-library-label"
rule = "V2-TYPE-GENERIC-bound-library-label"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#bounds: a parameter a library bound's label fixes is checked against its own bound at the operand whose implementation fixes it"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.unsatisfiedBound"
level = "@error"
source = "src/app/main.vib"
span = { start = 131, end = 143 }
related = [{ source = "stdlib/src/std/iter.vib", span = { start = 1927, end = 1934 } }]
