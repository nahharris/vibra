id = "V2-TYPE-GENERIC-given-repeated"
rule = "V2-TYPE-GENERIC-given-repeated"
profile = "staticV2"
operation = "resolve"
description = "02-type-system.md#bounds: a repeated given key is @name.redeclaration at the later key, related to the first"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = { start = 39, end = 40 }
related = [{ source = "src/app/main.vib", span = { start = 32, end = 33 } }]
