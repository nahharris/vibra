id = "V2-TYPE-GENERIC-bound-expected-only"
rule = "V2-TYPE-GENERIC-bound-expected-only"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#bounds: a type argument only the expected type fixes is checked against its bound at the expected type"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.unsatisfiedBound"
level = "@error"
source = "src/app/main.vib"
span = { start = 253, end = 266 }
related = [{ source = "src/app/main.vib", span = { start = 184, end = 191 } }]
