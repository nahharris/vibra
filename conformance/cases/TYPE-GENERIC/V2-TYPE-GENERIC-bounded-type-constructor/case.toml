id = "V2-TYPE-GENERIC-bounded-type-constructor"
rule = "V2-TYPE-GENERIC-bounded-type-constructor"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#bounds: a constructor application whose inferred type argument breaks the bound is @type.unsatisfiedBound at the operand that fixes it"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.unsatisfiedBound"
level = "@error"
source = "src/app/main.vib"
span = { start = 120, end = 133 }
related = [{ source = "src/app/main.vib", span = { start = 38, end = 45 } }]
