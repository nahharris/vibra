id = "V1-RUNTIME-activation-exhaustion-discarded-call"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "interpret"
description = "Non-tail recursion with no base case exhausts the memory of the instance, which ends execution with the host event and records no result and no audit trace. The recursion needs no integer operation: each call is the discarded operand of a sequence, so no activation is ever released."

[inputs]
source = "input.vib"

[expect]
accepted = true
host_event = "@runtime.memory-exhausted"
