id = "V1-PROJECT-workspace-check-initializer-cycle-span"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "An initializer-cycle diagnostic points to the cycle after an unrelated acyclic global."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.initializer-cycle"
level = "@error"
source = "src/app/main.vib"
span = [25, 47]
