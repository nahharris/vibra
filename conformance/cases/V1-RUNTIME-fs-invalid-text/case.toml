id = "V1-RUNTIME-fs-invalid-text"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-run"
description = "Bytes that are not UTF-8 read as text are the typed error invalid-text, returned as the err of the call and discarded by the program, which continues; the same file read as bytes succeeds."

[inputs]
project = "tree/project.vibon"
tree = "tree"
host-world = "world.vibon"

[expect]
accepted = true
interpreter = { result = "result.vibon", audit_trace = "audit.vibon" }
