id = "V2-CONTRACT-unused-effect-target"
rule = "V2-CONTRACT-unused-effect-target"
profile = "staticV2"
operation = "workspaceCheck"
description = "03-effects.md#target-admission: an effects entry that neither the entry nor a startup step performs is the warning @contract.unusedEffect at that entry"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "accepted"

[[expect.diagnostics]]
code = "@contract.unusedEffect"
level = "@warning"
source = "project.vibon"
span = { start = 144, end = 157 }
