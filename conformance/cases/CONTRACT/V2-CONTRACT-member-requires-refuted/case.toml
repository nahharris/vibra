id = "V2-CONTRACT-member-requires-refuted"
rule = "V2-CONTRACT-member-requires-refuted"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#guards-and-callable-types: GUARD-1: a call of a contract member whose bare requires is false of its constant arguments is @contract.refuted at the predicate, related to the argument"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@contract.refuted"
level = "@error"
source = "src/app/main.vib"
span = { start = 89, end = 112 }
related = [{ source = "src/app/main.vib", span = { start = 304, end = 308 } }]
