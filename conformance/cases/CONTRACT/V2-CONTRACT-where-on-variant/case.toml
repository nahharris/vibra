id = "V2-CONTRACT-where-on-variant"
rule = "V2-CONTRACT-where-on-variant"
profile = "staticV2"
operation = "workspaceCheck"
description = "07-diagnostics-and-conformance.md#contract-effect-and-authority-diagnostics: a where on a variant type is @type.invalidInvariant at the where"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
