id = "V2-CONTRACT-ingress-constant"
rule = "V2-CONTRACT-ingress-constant"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#bare-guards: GUARD-1: a module value constructed from a constant is an ingress path: a bare where false at the constant is @contract.refuted at the predicate, related to the construction"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@contract.refuted"
level = "@error"
source = "src/app/main.vib"
span = { start = 27, end = 37 }
related = [{ source = "src/app/main.vib", span = { start = 150, end = 164 } }]
