id = "V1-PROJECT-workspace-check-nominal-private"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "A private declared type of another module is not visible as a type or as a constructor."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false


[[expect.diagnostics]]
code = "@name.private-access"
level = "@error"
source = "src/app/main.vib"
span = [40, 59]

[[expect.diagnostics]]
code = "@name.private-access"
level = "@error"
source = "src/app/main.vib"
span = [97, 110]

  [[expect.diagnostics.related]]
  source = "src/geo/shapes.vib"
  span = [0, 35]
