id = "V1-TYPE-CONTROL-branch-mismatch"
rule = "V1-TYPE-CONTROL"
profile = "static-v1"
operation = "type-check"
description = "Without an expected type, both if branches must have exactly the same primitive type."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.argument-mismatch"
level = "@error"
source = "input.vib"
span = [24, 45]
