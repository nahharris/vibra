id = "V1-TYPE-NAMES-binding-labelled-shadow"
rule = "V1-TYPE-NAMES"
profile = "static-v1"
operation = "workspace-check"
description = "A labelled parameter name that shadows a positional parameter or module value is reported at the name alone."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = [60, 65]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [32, 37]

[[expect.diagnostics]]
code = "@name.redeclaration"
level = "@error"
source = "src/app/main.vib"
span = [75, 80]

  [[expect.diagnostics.related]]
  source = "src/app/main.vib"
  span = [0, 17]
