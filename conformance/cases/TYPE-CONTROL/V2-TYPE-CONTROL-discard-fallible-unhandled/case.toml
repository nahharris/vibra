id = "V2-TYPE-CONTROL-discard-fallible-unhandled"
rule = "V2-TYPE-CONTROL-discard-fallible-unhandled"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#fallible-values: without let _ be, the same fallible value left unused by an expression statement is @type.unhandledFallible at the statement"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.unhandledFallible"
level = "@error"
source = "src/app/main.vib"
span = { start = 102, end = 111 }
