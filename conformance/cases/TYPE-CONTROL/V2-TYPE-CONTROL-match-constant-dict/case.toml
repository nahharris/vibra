id = "V2-TYPE-CONTROL-match-constant-dict"
rule = "V2-TYPE-CONTROL-match-constant-dict"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#constant-expressions-and-constant-patterns: a dict has no pattern form, so a dict constant in pattern position is @pattern.unsupportedCoverage at the pattern"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@pattern.unsupportedCoverage"
level = "@error"
source = "src/app/main.vib"
span = { start = 122, end = 127 }
