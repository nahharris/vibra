id = "V2-TYPE-CONTROL-do-ends-in-let-returned"
rule = "V2-TYPE-CONTROL-do-ends-in-let-returned"
profile = "staticV2"
operation = "workspaceCheck"
description = "01-source-language.md#if-match-do: a do block that ends in a let yields void, so returning it from a callable whose result is I32 is a mismatch at the return operand"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.mismatch"
level = "@error"
source = "src/app/main.vib"
span = { start = 79, end = 80 }
