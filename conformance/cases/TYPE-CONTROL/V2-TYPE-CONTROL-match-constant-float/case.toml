id = "V2-TYPE-CONTROL-match-constant-float"
rule = "V2-TYPE-CONTROL-match-constant-float"
profile = "staticV2"
operation = "workspaceCheck"
description = "02-type-system.md#constant-expressions-and-constant-patterns: a float has no pattern form, so a float constant in pattern position is @pattern.invalidConstant at the pattern"

