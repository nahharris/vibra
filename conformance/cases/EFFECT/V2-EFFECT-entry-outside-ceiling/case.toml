id = "V2-EFFECT-entry-outside-ceiling"
rule = "V2-EFFECT-entry-outside-ceiling"
profile = "staticV2"
operation = "workspaceCheck"
description = "07-diagnostics-and-conformance.md#contract-effect-and-authority-diagnostics: an entry row outside the target's effects is @effect.outsideCeiling at the effects field, related to the performs entry"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@effect.outsideCeiling"
level = "@error"
source = "project.vibon"
span = { start = 143, end = 145 }
related = [{ source = "src/app/main.vib", span = { start = 373, end = 376 } }]
