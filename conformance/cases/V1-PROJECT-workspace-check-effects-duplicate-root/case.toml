id = "V1-PROJECT-workspace-check-effects-duplicate-root"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "A root listed twice in a target array is @effect.duplicate-root at the second atom, relating the first, as in any written row; the second atom adds no further diagnostic."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@effect.duplicate-root"
level = "@error"
source = "project.vibon"
span = [209, 223]

  [[expect.diagnostics.related]]
  source = "project.vibon"
  span = [179, 193]
