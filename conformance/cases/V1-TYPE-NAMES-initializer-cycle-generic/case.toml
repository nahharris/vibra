id = "V1-TYPE-NAMES-initializer-cycle-generic"
rule = "V1-TYPE-NAMES"
profile = "static-v1"
operation = "type-check"
description = "A module-value cycle through a function passed through a generic parameter is detected."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.initializer-cycle"
level = "@error"
source = "input.vib"
span = [98, 145]
