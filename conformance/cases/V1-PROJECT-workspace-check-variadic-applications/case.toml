id = "V1-PROJECT-workspace-check-variadic-applications"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "Workspace checking reports variadic declaration and application unavailability at their source forms."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
source = "src/main.vib"
span = [0, 75]

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
source = "src/main.vib"
span = [105, 125]

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
source = "src/main.vib"
span = [126, 151]

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
source = "src/main.vib"
span = [154, 229]

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
source = "src/main.vib"
span = [257, 275]

[[expect.diagnostics]]
code = "@tool.unavailable"
level = "@error"
source = "src/main.vib"
span = [276, 305]
