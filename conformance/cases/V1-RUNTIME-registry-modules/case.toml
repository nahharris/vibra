id = "V1-RUNTIME-registry-modules"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-test"
description = "The char, text, and bytes registry rows run through their real module imports: scalar conversions, surrogate rejection, scalar-counted slices, UTF-8 encoding and decoding, and byte order and slicing."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
interpreter = { result = "result.vibon" }
