id = "V1-TYPE-NOMINAL-collection-construction"
rule = "V1-TYPE-NOMINAL"
profile = "static-v1"
operation = "type-check"
description = "An odd dict.of tail and a heterogeneous array.of are argument mismatches, an empty array.of needs an expected type, and a tuple index must name a component."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.argument-mismatch"
level = "@error"
source = "input.vib"
span = [28, 50]

[[expect.diagnostics]]
code = "@type.argument-mismatch"
level = "@error"
source = "input.vib"
span = [95, 98]

[[expect.diagnostics]]
code = "@type.ambiguous-inference"
level = "@error"
source = "input.vib"
span = [132, 142]

[[expect.diagnostics]]
code = "@type.invalid-tuple-index"
level = "@error"
source = "input.vib"
span = [192, 193]

[[expect.diagnostics]]
code = "@type.invalid-tuple-index"
level = "@error"
source = "input.vib"
span = [237, 239]
