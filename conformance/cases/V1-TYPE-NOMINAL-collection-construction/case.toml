id = "V1-TYPE-NOMINAL-collection-construction"
rule = "V1-TYPE-NOMINAL"
profile = "static-v1"
operation = "type-check"
description = "An odd map.of tail and a heterogeneous array.of are argument mismatches, an empty array.of needs an expected type, and a tuple index must name a component."

[inputs]
source = "input.vib"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@type.argument-mismatch"
level = "@error"
source = "input.vib"
span = [27, 48]

[[expect.diagnostics]]
code = "@type.argument-mismatch"
level = "@error"
source = "input.vib"
span = [93, 96]

[[expect.diagnostics]]
code = "@type.ambiguous-inference"
level = "@error"
source = "input.vib"
span = [130, 140]

[[expect.diagnostics]]
code = "@type.invalid-tuple-index"
level = "@error"
source = "input.vib"
span = [190, 191]

[[expect.diagnostics]]
code = "@type.invalid-tuple-index"
level = "@error"
source = "input.vib"
span = [235, 237]
