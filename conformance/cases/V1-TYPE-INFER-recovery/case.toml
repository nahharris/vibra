id = "V1-TYPE-INFER-recovery"
rule = "V1-TYPE-INFER"
profile = "static-v1"
operation = "workspace-check"
description = "Recovered malformed source is rejected before typed IR lowering."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@syntax.invalid-form"
level = "@error"
source = "src/app/main.vib"
span = [17, 30]

[[expect.diagnostics]]
code = "@syntax.unmatched-delimiter"
level = "@error"
source = "src/app/main.vib"
span = [30, 30]

[[expect.diagnostics]]
code = "@syntax.unmatched-delimiter"
level = "@error"
source = "src/app/main.vib"
span = [30, 30]
