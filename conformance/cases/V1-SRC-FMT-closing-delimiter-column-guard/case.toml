id = "V1-SRC-FMT-closing-delimiter-column-guard"
rule = "V1-SRC-FMT"
profile = "reader-v1"
description = "A closing delimiter that would pass 88 columns drops to its own line. The guard is about columns, not comments: a commented last atom is guarded the same way."

[inputs]
source = "input.vib"

[expect]
accepted = true
formatted = "formatted.vib"
