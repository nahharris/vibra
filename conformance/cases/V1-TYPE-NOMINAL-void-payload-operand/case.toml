id = "V1-TYPE-NOMINAL-void-payload-operand"
rule = "V1-TYPE-NOMINAL"
profile = "static-v1"
operation = "workspace-check"
description = "A void operand is rejected for a variant whose payload it would fix to void, with or without a written expected type."

