id = "V1-PROJECT-workspace-check-bootstrap-source-id-collision"
rule = "V1-PROJECT"
profile = "static-v1"
operation = "workspace-check"
description = "A local module cannot reuse an embedded standard-library source identity."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = false

[[expect.diagnostics]]
code = "@module.source-id-collision"
level = "@error"
source = "stdlib/src/std/text.vib"
span = [0, 0]
