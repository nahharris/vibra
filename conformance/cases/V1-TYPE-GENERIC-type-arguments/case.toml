id = "V1-TYPE-GENERIC-type-arguments"
rule = "V1-TYPE-GENERIC"
profile = "static-v1"
operation = "workspace-check"
description = "A types: list must match the complete parameter list and agree with the operands; a non-generic callee takes none."

