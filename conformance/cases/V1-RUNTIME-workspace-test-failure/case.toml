id = "V1-RUNTIME-workspace-test-failure"
rule = "V1-RUNTIME"
profile = "interpreter-v1"
operation = "workspace-test"
description = "A false equality assertion is reported as a structured test failure, not a trap."

[inputs]
project = "tree/project.vibon"
tree = "tree"

[expect]
accepted = true
interpreter = { result = "result.vibon" }
