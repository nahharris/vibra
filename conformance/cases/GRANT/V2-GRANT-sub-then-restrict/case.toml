# would differ.
id = "V2-GRANT-sub-then-restrict"
rule = "V2-GRANT-sub-then-restrict"
profile = "interpreterV2"
operation = "workspaceTest"
description = "03-effects.md#narrowing: a policy given to restrict on a sub grant is rooted at that grant: textOnly below sub reads s.txt"

