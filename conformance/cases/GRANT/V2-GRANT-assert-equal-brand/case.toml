# V2-GRANT-equatable-brand-equal.
id = "V2-GRANT-assert-equal-brand"
rule = "V2-GRANT-assert-equal-brand"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#assertions: a brand over a grant with its own Equatable still holds a grant and is not Encodable: assert.equal on it is @type.unsatisfiedBound at the operand that fixes T, related to the bound"

