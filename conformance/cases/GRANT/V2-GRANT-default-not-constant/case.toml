id = "V2-GRANT-default-not-constant"
rule = "V2-GRANT-default-not-constant"
profile = "staticV2"
operation = "workspaceCheck"
description = "06-runtime.md#what-has-no-encoding: a labelled default is a constant, and a type that holds a grant has no encoding, so Option(DirReadText) be Option.none() is @type.notConstant at the default"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@type.notConstant"
level = "@error"
source = "src/app/main.vib"
span = { start = 84, end = 97 }