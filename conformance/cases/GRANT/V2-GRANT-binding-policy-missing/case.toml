id = "V2-GRANT-binding-policy-missing"
rule = "V2-GRANT-binding-policy-missing"
profile = "staticV2"
operation = "workspaceCheck"
description = "04-programs-and-packages.md#targets: a @host.fs.directory recipe requires a policy: @grant.invalidBinding at the binding"

