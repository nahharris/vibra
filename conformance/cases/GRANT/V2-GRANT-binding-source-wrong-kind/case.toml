id = "V2-GRANT-binding-source-wrong-kind"
rule = "V2-GRANT-binding-source-wrong-kind"
profile = "staticV2"
operation = "workspaceCheck"
description = "07-diagnostics-and-conformance.md#contract-effect-and-authority-diagnostics: a source leaf of the wrong kind is @grant.invalidBinding at source"

[inputs]
tree = "tree"
project = "tree/project.vibon"

[expect]
verdict = "refuted"

[[expect.diagnostics]]
code = "@grant.invalidBinding"
level = "@error"
source = "project.vibon"
span = { start = 383, end = 387 }

[[expect.diagnostics]]
code = "@contract.unusedEffect"
level = "@warning"
source = "src/app/main.vib"
span = { start = 248, end = 259 }

[[expect.diagnostics]]
code = "@contract.unusedEffect"
level = "@warning"
source = "src/app/main.vib"
span = { start = 260, end = 271 }

[[expect.diagnostics]]
code = "@contract.unusedEffect"
level = "@warning"
source = "src/app/main.vib"
span = { start = 272, end = 282 }
