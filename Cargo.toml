[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["archive"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nahharris/vibra"
publish = false

[workspace.dependencies]
vibra-conformance = { path = "crates/vibra-conformance" }
vibra-diagnostics = { path = "crates/vibra-diagnostics" }
vibra-fmt = { path = "crates/vibra-fmt" }
vibra-interp = { path = "crates/vibra-interp" }
vibra-ir = { path = "crates/vibra-ir" }
vibra-schema = { path = "crates/vibra-schema" }
vibra-syntax = { path = "crates/vibra-syntax" }
vibra-resolve = { path = "crates/vibra-resolve" }
vibra-types = { path = "crates/vibra-types" }
vibra-wasm = { path = "crates/vibra-wasm" }
vibra-wasm-run = { path = "crates/vibra-wasm-run" }
vibra-workspace = { path = "crates/vibra-workspace" }

toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.35", default-features = false }
sha2 = "0.10"
rustix = { version = "1.1.4", features = ["fs"] }

# The WebAssembly backend (milestone 4, Step 4). The engine is Wasmtime with
# Cranelift only, and only `vibra-wasm-run` may depend on it. `wasm-encoder`
# emits modules, and `wasmparser` validates them under the v1 feature baseline.
wasm-encoder = { version = "0.261", default-features = false, features = ["std"] }
wasmparser = { version = "0.261", default-features = false, features = ["std", "validate", "features", "simd"] }
wasmtime = { version = "49.0.2", default-features = false, features = ["std", "runtime", "cranelift"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# The reader runs on untrusted, incomplete input. A panic there is a defect,
# and the milestone 1 exit gate fuzzes for exactly this.
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
overflow-checks = true
