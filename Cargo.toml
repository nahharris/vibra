[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["archive"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nahharris/vibra"
publish = false

[workspace.dependencies]
vibra-actors = { path = "crates/vibra-actors" }
vibra-build = { path = "crates/vibra-build" }
vibra-codegen = { path = "crates/vibra-codegen" }
vibra-cli = { path = "crates/vibra-cli" }
vibra-conformance = { path = "crates/vibra-conformance" }
vibra-diagnostics = { path = "crates/vibra-diagnostics" }
vibra-diagnostics-v1 = { path = "crates/vibra-diagnostics-v1" }
vibra-exec = { path = "crates/vibra-exec" }
vibra-fmt = { path = "crates/vibra-fmt" }
vibra-fs-scope = { path = "crates/vibra-fs-scope" }
vibra-host = { path = "crates/vibra-host" }
vibra-host-v1 = { path = "crates/vibra-host-v1" }
vibra-interp = { path = "crates/vibra-interp" }
vibra-lower = { path = "crates/vibra-lower" }
vibra-ir = { path = "crates/vibra-ir" }
vibra-ir-v1 = { path = "crates/vibra-ir-v1" }
vibra-native = { path = "crates/vibra-native" }
vibra-native-v1 = { path = "crates/vibra-native-v1" }
vibra-nexus = { path = "crates/vibra-nexus" }
vibra-nexus-bridge = { path = "crates/vibra-nexus-bridge", features = ["library"] }
vibra-nexus-eval = { path = "crates/vibra-nexus-eval" }
vibra-syntax = { path = "crates/vibra-syntax" }
vibra-syntax-v1 = { path = "crates/vibra-syntax-v1" }
vibra-resolve = { path = "crates/vibra-resolve" }
vibra-schema = { path = "crates/vibra-schema" }
vibra-types = { path = "crates/vibra-types" }
vibra-workspace = { path = "crates/vibra-workspace" }

toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.35", default-features = false }
sha2 = "0.10"
# The operating system's random source, read only by the system provider of
# `vibra-host`.
getrandom = "0.3"

# The Windows file-scope adapter's NT calls (`vibra-fs-scope`). It is already
# in the lock file through other dependencies.
windows-sys = "0.61.2"


[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# The reader runs on untrusted, incomplete input. A panic there is a defect,
# and the milestone 1 exit gate fuzzes for exactly this.
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"

# Every test that generates native code runs Cranelift, and an unoptimized
# Cranelift is an order of magnitude slower than an optimized one. Dependencies
# are built once and cached, so they are optimized in the test profile, while the
# workspace's own crates stay unoptimized and debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
overflow-checks = true
